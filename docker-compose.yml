name: hsrp-dms

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hsrp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hsrp_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-hsrp}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hsrp} -d ${POSTGRES_DB:-hsrp}"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hsrp}:${POSTGRES_PASSWORD:-hsrp_local_only}@db:5432/${POSTGRES_DB:-hsrp}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      INTERNAL_API_URL: http://localhost:3000
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  dbdata:
